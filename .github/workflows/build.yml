name: Build

on:
  workflow_run:
    workflows: ['Lint']
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Run affected build with fallback
        run: |
          echo "Running affected build..."
          npx nx affected -t build --verbose || {
            echo "⚠️ affected build failed, running full build instead...";
            npx nx run-many --target=build --all
          }

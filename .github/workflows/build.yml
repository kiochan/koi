name: Build

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Run affected build with fallback
        run: |
          echo "Running affected build..."
          npx nx affected -t build --verbose || {
            echo "⚠️ affected build failed, running full build instead...";
            npx nx build --all;
          }

name: Test

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Run affected tests with fallback
        run: |
          echo "Running affected tests..."
          npx nx affected -t test --verbose || {
            echo "⚠️ affected test failed, running all tests instead...";
            npx nx run-many --target=test --all
          }

name: CI

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show root directory structure
        run: ls -la

      - name: Show project files
        run: ls -la apps libs nx.json tsconfig.base.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Nx CLI version
        run: npx nx --version

      - name: Nx report
        run: npx nx report

      - name: Set base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Show affected range
        run: |
          echo "Base: $NX_BASE"
          echo "Head: $NX_HEAD"

      - name: Run affected tasks with fallback
        run: |
          echo "Running affected tasks..."
          npx nx affected -t lint test build --verbose || {
            echo "⚠️ nx affected failed. Running all tasks instead...";
            npx nx run-many -t lint test build --all;
          }

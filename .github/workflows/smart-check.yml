name: Smart Check

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Run affected tasks with fallback
        run: |
          echo "Running affected tasks..."
          npx nx affected -t lint test build --verbose || {
            echo "⚠️ nx affected failed. Running all tasks instead...";
            npx nx run-many -t lint test build --all;
          }

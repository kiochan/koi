name: Smart Check

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore Nx Cache
        uses: actions/cache@v3
        with:
          path: .nx/cache
          key: nx-cache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            nx-cache-${{ github.ref }}-
            nx-cache-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Fetch base branch explicitly
        run: git fetch origin dev:refs/remotes/origin/dev

      - name: Run affected tasks with fallback
        run: |
          echo "Running affected tasks..."
          npx nx affected -t lint test build --base=origin/dev --head=${{ github.sha }} --verbose || {
            echo "⚠️ nx affected failed. Running all tasks instead...";
            npx nx run-many -t lint test build --all --verbose;
          }
